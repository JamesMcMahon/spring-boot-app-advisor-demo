name: Upgrade Spring

on:
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Maven Settings
        uses: s4u/setup-maven-action@v1.18.0
        with:
          settings-repositories: '[{"id":"spring-commercial", "url":"https://packages.broadcom.com/artifactory/spring-enterprise"}]'
          settings-servers: '[{"id": "spring-commercial", "username": "${{ vars.SPRING_COMMERCIAL_USER }}", "password": "${{ secrets.SPRING_COMMERCIAL_TOKEN }}"}]'

      - name: Fix settings.xml
        shell: bash
        run: |
          sed -i 's|<settings>|<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">|g' ~/.m2/settings.xml

      - name: Download and Extract App Advisor
        run: |
          curl -L -u "${{ vars.SPRING_COMMERCIAL_USER }}:${{ secrets.SPRING_COMMERCIAL_TOKEN }}" -o application-advisor-cli-linux.tar https://packages.broadcom.com/artifactory/spring-enterprise/com/vmware/tanzu/spring/application-advisor-cli-linux/1.4.1/application-advisor-cli-linux-1.4.1.tar
          tar xf application-advisor-cli-linux.tar
          echo "$PWD/cli-binary" >> $GITHUB_PATH

      - name: Run App Advisor
        env:
          GIT_TOKEN_FOR_PRS: ${{ secrets.GIT_TOKEN_FOR_PRS }}
        run: |
          advisor build-config get
          advisor upgrade-plan apply --push

      - name: Show latest advisor error log
        if: failure()  # only run if a previous step failed
        run: |
          echo "---- Showing latest advisor error log ----"
          LATEST_LOG=$(ls -t .advisor/errors/*.log 2>/dev/null | head -n 1)
          if [ -n "$LATEST_LOG" ]; then
            echo "Latest log file: $LATEST_LOG"
            echo "----------------------------------------"
            cat "$LATEST_LOG"
            echo "----------------------------------------"
          else
            echo "No error logs found in .advisor/errors"
          fi
