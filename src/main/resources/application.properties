spring.application.name=upgradeexample
logging.level.org.springframework.jdbc=DEBUG
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
# TODO: [Advisor] Strongly recommended to configure the `management.endpoints.jmx.exposure.include` to expose ONLY required information
management.endpoints.jmx.exposure.include=*
spring.datasource.url=jdbc:h2:mem:example-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=not a secure password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
